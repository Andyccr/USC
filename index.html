<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141413">
  <meta name="color-scheme" content="dark light">
  <title>USC</title>
  <style>
    :root {
      --bg: #141413;
      --fg: #c9c4b8;
      --dim: #6e6a62;
      --line: #2c2b28;
      --err: #c45c4a;
      --find: #3d3828;
      --font-size: 15px;
    }
    :root[data-theme="light"] {
      --bg: #f2f0e9;
      --fg: #302f2b;
      --dim: #817d72;
      --line: #d8d4c9;
      --err: #a33f30;
      --find: #e5dcc0;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]):not([data-theme="light"]) {
        --bg: #f2f0e9;
        --fg: #302f2b;
        --dim: #817d72;
        --line: #d8d4c9;
        --err: #a33f30;
        --find: #e5dcc0;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font: var(--font-size)/1.7 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    #page {
      flex: 1;
      overflow: auto;
      padding: 40px 28px 20px;
      max-width: 72ch;
      width: 100%;
      margin: 0 auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    body.home #page {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--dim);
    }
    body.home #page .mark {
      font-size: 22px;
      letter-spacing: 0.28em;
      color: var(--fg);
    }
    body.home #page .hint {
      display: block;
      margin-top: 18px;
      letter-spacing: 0.04em;
      color: var(--dim);
    }
    #page a.ln {
      color: var(--fg);
      text-decoration: none;
      border-bottom: 1px solid var(--line);
    }
    #page a.ln:hover { border-bottom-color: var(--fg); }
    #page .imgph {
      color: var(--dim);
      background: transparent;
      border: 0;
      padding: 0;
      font: inherit;
      cursor: pointer;
    }
    #page button.imgph:hover { color: var(--fg); }
    #page img.pic {
      display: block;
      max-width: min(100%, 520px);
      height: auto;
      margin: 12px 0;
    }
    #page .find {
      background: var(--find);
      color: var(--fg);
    }
    #chrome {
      max-width: 72ch;
      width: 100%;
      margin: 0 auto;
      padding: 0 28px 22px;
    }
    #status {
      min-height: 1.7em;
      color: var(--dim);
      font-size: 12px;
      letter-spacing: 0.04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    body.home #status { color: transparent; }
    #msg:empty, #hint:empty { display: none; }
    #msg, #hint {
      color: var(--dim);
      white-space: pre-wrap;
      word-break: break-word;
    }
    #msg a, #hint a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid var(--line);
    }
    .err { color: var(--err); }
    #prompt {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-top: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }
    #progress {
      height: 1px;
      background: transparent;
    }
    #progress span {
      display: block;
      width: 0;
      height: 100%;
      background: var(--dim);
      transition: width 120ms linear;
    }
    #prompt label {
      color: var(--dim);
      flex: none;
    }
    #q {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: 0;
      color: var(--fg);
      font: inherit;
      outline: none;
      padding: 0;
    }
    #q::placeholder { color: var(--dim); }
    ::selection {
      background: #3a3832;
      color: var(--fg);
    }
  </style>
</head>
<body class="home">
  <section id="page" role="document" aria-label="Page content"></section>
  <div id="chrome">
    <div id="status" aria-live="polite" aria-atomic="true"></div>
    <div id="msg" aria-live="polite"></div>
    <div id="hint" role="status"></div>
    <div id="progress" aria-hidden="true"><span></span></div>
    <form id="prompt" autocomplete="off">
      <label for="q">›</label>
      <input id="q" type="text" placeholder="search or url" aria-label="Search or URL" aria-describedby="hint" spellcheck="false" autocapitalize="off" autocorrect="off" autofocus>
    </form>
  </div>
  <noscript>USC 需要 JavaScript。</noscript>
  <script src="browser.js"></script>
  <script src="usc.js"></script>
</body>
</html>
