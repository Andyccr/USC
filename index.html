<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>USC</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #111;
      color: #d6d6d6;
      font: 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    #page {
      flex: 1;
      overflow: auto;
      padding: 12px 16px 8px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #page a.ln {
      color: #8ab4c4;
      text-decoration: none;
    }
    #page a.ln:hover { text-decoration: underline; }
    #page .imgph { color: #888; }
    #page img.pic {
      display: block;
      max-width: min(100%, 560px);
      height: auto;
      margin: 8px 0;
      background: #000;
    }
    #page .find {
      background: #5a4a20;
      color: #fff;
    }
    #status {
      border-top: 1px solid #2a2a2a;
      padding: 4px 16px;
      color: #777;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #msg {
      max-height: 7.5em;
      overflow: auto;
      padding: 0 16px 4px;
      color: #9a9a9a;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #msg a {
      color: inherit;
      text-decoration: none;
    }
    #msg a:hover { text-decoration: underline; }
    .err { color: #c98a8a; }
    #prompt {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px 12px;
      border-top: 1px solid #2a2a2a;
      background: #111;
    }
    #prompt label {
      color: #888;
      flex: none;
    }
    #q {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: 0;
      color: #d6d6d6;
      font: inherit;
      outline: none;
      padding: 0;
    }
  </style>
</head>
<body>
  <section id="page" aria-label="page"></section>
  <div id="status"></div>
  <div id="msg" aria-live="polite"></div>
  <form id="prompt" autocomplete="off">
    <label for="q">usc&gt;</label>
    <input id="q" type="text" spellcheck="false" autocapitalize="off" autocorrect="off" autofocus>
  </form>
  <noscript>USC 需要 JavaScript。</noscript>
  <script src="browser.js"></script>
  <script src="usc.js"></script>
</body>
</html>
