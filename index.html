<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141413">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="USC — 纯文本浏览器与站内搜索">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="USC">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <title>USC</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("usc.theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <style>
    :root {
      --bg: #141413;
      --fg: #c9c4b8;
      --dim: #6e6a62;
      --line: #2c2b28;
      --err: #c45c4a;
      --find: #3d3828;
      --sel: #3a3832;
      --font-size: 15px;
      --pad-x: 28px;
      --chrome-pad-bottom: 22px;
      --tap: 44px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      color-scheme: dark;
    }
    :root[data-theme="light"] {
      --bg: #f2f0e9;
      --fg: #302f2b;
      --dim: #817d72;
      --line: #d8d4c9;
      --err: #a33f30;
      --find: #e5dcc0;
      --sel: #d4cebc;
      color-scheme: light;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]):not([data-theme="light"]) {
        --bg: #f2f0e9;
        --fg: #302f2b;
        --dim: #817d72;
        --line: #d8d4c9;
        --err: #a33f30;
        --find: #e5dcc0;
        --sel: #d4cebc;
        color-scheme: light;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font: var(--font-size)/1.7 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100%;
      min-height: 100dvh;
      padding:
        var(--safe-top)
        var(--safe-right)
        0
        var(--safe-left);
      overflow: hidden;
    }
    #page {
      flex: 1;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 40px var(--pad-x) 20px;
      max-width: 72ch;
      width: 100%;
      margin: 0 auto;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    body.home #page {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--dim);
    }
    body.home #page .mark {
      font-size: 22px;
      letter-spacing: 0.28em;
      color: var(--fg);
    }
    body.home #page .hint {
      display: block;
      margin-top: 18px;
      letter-spacing: 0.04em;
      color: var(--dim);
    }
    #page a.ln {
      color: var(--fg);
      text-decoration: none;
      border-bottom: 1px solid var(--line);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      cursor: pointer;
    }
    #page a.ln:hover { border-bottom-color: var(--fg); }
    #page a.ln:active { color: var(--dim); }
    body.search-results #page a.ln {
      display: inline-block;
      max-width: 100%;
      padding: 0.45em 0;
      line-height: 1.45;
      border-bottom-color: var(--line);
    }
    #page .imgph {
      color: var(--dim);
      background: transparent;
      border: 0;
      padding: 0;
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #page a.imgph {
      color: var(--dim);
      text-decoration: none;
      border-bottom: 1px solid var(--line);
    }
    #page a.imgph:hover { color: var(--fg); border-bottom-color: var(--fg); }
    #page button.imgph:hover { color: var(--fg); }
    #page img.pic {
      display: block;
      max-width: min(100%, 520px);
      height: auto;
      margin: 12px 0;
    }
    #page .find {
      background: var(--find);
      color: var(--fg);
    }
    #chrome {
      flex: none;
      max-width: 72ch;
      width: 100%;
      margin: 0 auto;
      padding:
        0
        var(--pad-x)
        calc(var(--chrome-pad-bottom) + var(--safe-bottom) + var(--keyboard-inset, 0px));
      background: var(--bg);
      border-top: 0;
    }
    #status {
      min-height: 1.7em;
      color: var(--dim);
      font-size: 12px;
      letter-spacing: 0.04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    body.home #status { color: transparent; }
    #msg:empty, #hint:empty { display: none; }
    #msg, #hint {
      color: var(--dim);
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    #msg a, #hint a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid var(--line);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .err { color: var(--err); }
    #prompt {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      min-height: var(--tap);
    }
    #progress {
      height: 1px;
      background: transparent;
    }
    #progress span {
      display: block;
      width: 0;
      height: 100%;
      background: var(--dim);
      transition: width 120ms linear;
    }
    #prompt label {
      color: var(--dim);
      flex: none;
      line-height: 1;
    }
    #q {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: 0;
      color: var(--fg);
      font: inherit;
      font-size: max(16px, var(--font-size));
      outline: none;
      padding: 8px 0;
      border-radius: 0;
      -webkit-appearance: none;
      appearance: none;
    }
    #q::placeholder { color: var(--dim); }
    #theme {
      flex: none;
      min-width: var(--tap);
      min-height: var(--tap);
      margin: 0;
      padding: 0 4px;
      border: 0;
      background: transparent;
      color: var(--dim);
      font: inherit;
      font-size: 12px;
      letter-spacing: 0.06em;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #theme:hover, #theme:focus-visible {
      color: var(--fg);
      outline: none;
    }
    ::selection {
      background: var(--sel);
      color: var(--fg);
    }
    @media (max-width: 720px) {
      :root {
        --pad-x: 16px;
        --chrome-pad-bottom: 12px;
        --font-size: 16px;
      }
      #page {
        padding-top: 24px;
        padding-bottom: 16px;
        line-height: 1.65;
      }
      #page a.ln {
        display: inline;
        line-height: 1.85;
        padding: 0.15em 0;
      }
      #status {
        font-size: 11px;
      }
      body.home #page .mark {
        font-size: 20px;
        letter-spacing: 0.22em;
      }
      #page img.pic {
        max-width: 100%;
      }
    }
    @media (pointer: coarse) {
      #page a.ln,
      #msg a,
      #page button.imgph {
        min-height: 1.6em;
      }
    }
  </style>
</head>
<body class="home">
  <section id="page" role="document" aria-label="Page content"></section>
  <div id="chrome">
    <div id="status" aria-live="polite" aria-atomic="true"></div>
    <div id="msg" aria-live="polite"></div>
    <div id="hint" role="status"></div>
    <div id="progress" aria-hidden="true"><span></span></div>
    <form id="prompt" autocomplete="off" action="#">
      <label for="q">›</label>
      <input id="q" type="search" inputmode="search" enterkeyhint="search" placeholder="search or url" aria-label="Search or URL" aria-describedby="hint" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" autofocus>
      <button type="button" id="theme" aria-label="Cycle theme: dark, light, auto">auto</button>
    </form>
  </div>
  <noscript>USC 需要 JavaScript。</noscript>
  <script src="browser.js"></script>
  <script src="usc.js"></script>
</body>
</html>
