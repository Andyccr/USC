<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>USC</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #111;
      color: #d6d6d6;
      font: 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    #term {
      flex: 1;
      overflow: auto;
      padding: 12px 16px 8px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #term a {
      color: inherit;
      text-decoration: none;
    }
    #term a:hover { text-decoration: underline; }
    .muted { color: #888; }
    .err { color: #c98a8a; }
    #prompt {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px 12px;
      border-top: 1px solid #2a2a2a;
      background: #111;
    }
    #prompt label {
      color: #888;
      flex: none;
    }
    #q {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: 0;
      color: #d6d6d6;
      font: inherit;
      outline: none;
      padding: 0;
    }
  </style>
</head>
<body>
  <main id="term" aria-live="polite"></main>
  <form id="prompt" autocomplete="off">
    <label for="q">usc&gt;</label>
    <input id="q" type="text" spellcheck="false" autocapitalize="off" autocorrect="off" autofocus>
  </form>
  <noscript>USC 需要 JavaScript 才能调用 Google / Bing / 百度。</noscript>
  <script src="usc.js"></script>
</body>
</html>
